# Example Apache reverse-proxy vhost. Placeholders: server name and certificate paths.
# Needs: mod_ssl, mod_proxy, mod_proxy_http, mod_headers
<VirtualHost *:443>
    ServerName engine.example.org

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/engine.example.org.crt
    SSLCertificateKeyFile /etc/ssl/private/engine.example.org.key

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "https"

    # The engine has its own body limit too (256 KB, and 4 MiB for POST /v1/activities
    # and POST /v1/health/summary); this stops larger bodies earlier. It must stay above
    # 4 MiB: a focus or breathing record with raw face frames is 0.4 to 3 MB
    # (docs/face-raw.md), and a smaller limit here silently throws every one of them away.
    LimitRequestBody 4456448

    # Do not log query strings or bodies.
    LogFormat "%h %t \"%m %U %H\" %>s %b %D" engine
    CustomLog ${APACHE_LOG_DIR}/engine-access.log engine
</VirtualHost>
