name: Lanvi
options:
  bundleIdPrefix: app.lanvi
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
targets:
  Lanvi:
    type: application
    platform: iOS
    sources:
      - path: Lanvi
        excludes: [Sense/Peter]
      - path: Shared
    dependencies:
      - target: Harness
      - target: LanviWatch
    info:
      path: Lanvi/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LanviServerURL: $(LANVI_SERVER_URL)
        LanviPairingCode: $(LANVI_PAIRING_CODE)
        UIAppFonts:
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHealthShareUsageDescription: "Lanvi reads how much you move and sleep: steps, walking speed, heart-rate variability and hours asleep. Never your messages, photos or location."
        NSCameraUsageDescription: "Only if you say yes: during two games Lanvi reads how your face moves, as numbers only. Never a picture or video."
    entitlements:
      path: Lanvi/Lanvi.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme:
      testTargets: [LanviTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lanvi.Lanvi
        PRODUCT_NAME: Lanvi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lanvi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LanviWatch:
    # The Apple Watch companion (ios/WATCH.md): records heart rate and HRV during a game
    # and sends every sample to the phone. A watchOS 10 single-target app, embedded in
    # Lanvi through the dependency above. Shares ios/Shared with the phone app.
    type: application
    platform: watchOS
    sources:
      - path: LanviWatch
      - path: Shared
    info:
      path: LanviWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.lanvi.Lanvi
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "Lanvi reads your heart rate and heart-rate variability while you play a game with Lanvi on your iPhone."
        NSHealthUpdateUsageDescription: "Lanvi saves the game as a short Mind and Body workout so the watch can read your heart at workout rate."
    entitlements:
      path: LanviWatch/LanviWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lanvi.Lanvi.watchkitapp
        PRODUCT_NAME: Lanvi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lanvi
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.lanvi.Lanvi
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SKIP_INSTALL: YES
  Harness:
    # Peter's HealthKit harness modules (Models, Statistics, HealthKit), as he wrote them.
    # Its own module, so his names never clash with the app's. See ios/SENSORS.md.
    type: framework
    platform: iOS
    sources: [Lanvi/Sense/Peter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lanvi.Harness
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  LanviTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LanviTests]
    dependencies:
      - target: Lanvi
      - target: Harness
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lanvi.LanviTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
