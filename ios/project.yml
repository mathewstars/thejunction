name: Lanvi
options:
  bundleIdPrefix: app.lanvi
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
targets:
  Lanvi:
    type: application
    platform: iOS
    sources: [Lanvi]
    info:
      path: Lanvi/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LanviServerURL: $(LANVI_SERVER_URL)
        LanviPairingCode: $(LANVI_PAIRING_CODE)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHealthShareUsageDescription: "Lanvi reads how much you move and sleep: steps, walking speed, heart-rate variability and hours asleep. Never your messages, photos or location."
        NSCameraUsageDescription: "Only if you say yes: during two games Lanvi watches your face and keeps a few numbers, like how often you smiled. Never a picture."
    entitlements:
      path: Lanvi/Lanvi.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme:
      testTargets: [LanviTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lanvi.Lanvi
        PRODUCT_NAME: Lanvi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lanvi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LanviTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LanviTests]
    dependencies:
      - target: Lanvi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lanvi.LanviTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
