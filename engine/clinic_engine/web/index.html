<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Clinician page</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a id="product-name" class="product" href="#/patients">Clinician page</a>
  <nav id="nav" class="nav" aria-label="Main" hidden>
    <a id="nav-patients" href="#/patients">Patients</a>
    <a id="nav-demo" href="#/demo" hidden>Demo</a>
  </nav>
  <div id="subnav" class="subnav"></div>
  <div id="who" class="who" hidden>
    <span id="clinic-name" class="clinic"></span>
    <button type="button" id="logout" class="btn">Sign out</button>
  </div>
</header>
<div class="band" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

<main id="main" tabindex="-1">
  <p id="flash" class="flash" role="status" aria-live="polite" hidden></p>

  <section id="view-login" class="login" aria-labelledby="login-title" hidden>
    <h1 id="login-title">Sign in</h1>
    <form id="login-form" novalidate>
      <label for="login-user">Username</label>
      <input id="login-user" name="username" autocomplete="username" required maxlength="64">
      <label for="login-pass">Password</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="256">
      <button type="submit" class="btn btn-primary">Sign in</button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
  </section>

  <div id="view" hidden></div>
</main>

<footer class="foot">Not an emergency service and not a diagnosis. Each person is compared only with their own earlier days.</footer>
</body>
</html>
