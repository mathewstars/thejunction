<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Clinician page</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <span id="product-name" class="product">Clinician page</span>
  <div id="who" class="who" hidden>
    <span id="clinic-name" class="clinic"></span>
    <button type="button" id="logout" class="pill pill-outline">Sign out</button>
  </div>
</header>
<div class="band" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<div id="top-tabs" class="tabs top-tabs" role="tablist" aria-label="Main sections" hidden>
  <button type="button" role="tab" id="tab-patients" aria-controls="panel-patients" aria-selected="true" data-route="#/patients">Patients</button>
  <button type="button" role="tab" id="tab-demo" aria-controls="panel-demo" aria-selected="false" tabindex="-1" data-route="#/demo" hidden>Demo</button>
</div>

<main id="main" tabindex="-1">
  <p id="flash" class="flash" role="status" aria-live="polite" hidden></p>

  <section id="view-login" class="panel narrow" aria-labelledby="login-title" hidden>
    <p class="eyebrow">Clinic staff</p>
    <h1 id="login-title">Sign in</h1>
    <form id="login-form" novalidate>
      <label for="login-user">Username</label>
      <input id="login-user" name="username" autocomplete="username" required maxlength="64">
      <label for="login-pass">Password</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="256">
      <button type="submit" class="pill pill-primary">Sign in</button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
    <p class="muted small">Every action is logged.</p>
  </section>

  <section id="panel-patients" role="tabpanel" aria-labelledby="tab-patients" hidden></section>
  <section id="panel-demo" role="tabpanel" aria-labelledby="tab-demo" hidden></section>
</main>

<footer class="foot">
  <p>Not an emergency service and not a diagnosis. Status compares each person with their own earlier days.</p>
</footer>
</body>
</html>
